<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F6F3EE">
<title>Rekeningen · Fluweel</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/finance-ui/app.css">
<script type="importmap">
{
  "imports": {
    "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/+esm",
    "@supabase/ssr": "https://cdn.jsdelivr.net/npm/@supabase/ssr@0.12.5/+esm"
  }
}
</script>
</head>
<body>
<div class="wrap">
  <p class="brand">Fluweel</p>
  <h1>Mijn rekeningen</h1>
  <p class="lead">Tik een rekening aan om naam, type of saldo aan te passen.</p>
  <div id="list" class="card"></div>
  <form id="form" class="card" hidden>
    <input type="hidden" name="id">
    <label>Naam
      <input name="name" required>
    </label>
    <label>Type
      <select name="account_type">
        <option value="checking">Betaalrekening</option>
        <option value="savings">Spaarrekening</option>
        <option value="other">Overig</option>
      </select>
    </label>
    <label>Huidig saldo
      <input name="opening_balance" inputmode="decimal" placeholder="0,00">
    </label>
    <p id="msg" hidden></p>
    <div class="actions">
      <button type="submit">Bewaar</button>
      <button type="button" class="secondary" id="cancel">Annuleer</button>
    </div>
  </form>
  <button type="button" class="secondary" id="add" style="width:100%">Rekening toevoegen</button>
</div>
<nav class="nav"><div class="inner">
  <a href="/finance/">Home</a>
  <a href="/finance/transactions">Transacties</a>
  <a href="/finance/budget">Begroting</a>
  <a href="/finance/more" class="active">Meer</a>
</div></nav>
<script type="module">
import {
  createSb, requireUser, parseAmount, formatMoney, accountTypeLabel, accountBalance, showMsg
} from '/finance-ui/app.js'

const sb = createSb()
const user = await requireUser(sb)
const list = document.getElementById('list')
const form = document.getElementById('form')
const msg = document.getElementById('msg')
const addBtn = document.getElementById('add')
let accounts = []
let transactions = []

function field (name) { return form.elements[name] }

function txDelta (account) {
  if (!account) return 0
  return accountBalance(account, transactions) - Number(account.opening_balance || 0)
}

function fill (account) {
  field('id').value = account?.id || ''
  field('name').value = account?.name || ''
  field('account_type').value = account?.account_type || 'checking'
  const current = account ? accountBalance(account, transactions) : ''
  field('opening_balance').value = account ? String(current).replace('.', ',') : ''
  showMsg(msg, '', 'ok')
  form.hidden = false
  addBtn.hidden = true
}

function closeForm () {
  form.hidden = true
  addBtn.hidden = false
  form.reset()
}

function paint () {
  if (!accounts.length) {
    list.innerHTML = '<p class="empty">Nog geen rekeningen.</p>'
    return
  }
  list.innerHTML = accounts.map((account) => `
    <button type="button" class="row" data-id="${account.id}">
      <span>
        <span class="name">${escapeHtml(account.name)}</span>
        <span class="meta">${accountTypeLabel(account.account_type)}</span>
      </span>
      <span class="money">${formatMoney(accountBalance(account, transactions))}</span>
    </button>
  `).join('')
  list.querySelectorAll('[data-id]').forEach((btn) => {
    btn.addEventListener('click', () => {
      fill(accounts.find((item) => item.id === btn.dataset.id))
    })
  })
}

function escapeHtml (value) {
  return String(value ?? '').replace(/[&<>"']/g, (ch) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[ch]))
}

async function load () {
  const [{ data, error }, tx] = await Promise.all([
    sb.from('finance_accounts').select('*').eq('is_archived', false).order('sort_order'),
    sb.from('finance_transactions').select('account_id, counterparty_account_id, entry_type, amount, date')
  ])
  if (error) throw error
  if (tx.error) throw tx.error
  accounts = data || []
  transactions = tx.data || []
  paint()
}

form.addEventListener('submit', async (event) => {
  event.preventDefault()
  const id = field('id').value
  const name = field('name').value.trim()
  const desired = parseAmount(field('opening_balance').value) ?? 0
  if (!name) return showMsg(msg, 'Geef de rekening een naam.')
  const current = accounts.find((item) => item.id === id)
  const openingBalance = Math.round((desired - txDelta(current)) * 100) / 100
  const payload = {
    name,
    account_type: field('account_type').value,
    opening_balance: openingBalance
  }
  let error
  if (id) {
    ;({ error } = await sb.from('finance_accounts').update({
      ...payload,
      updated_at: new Date().toISOString()
    }).eq('id', id))
  } else {
    ;({ error } = await sb.from('finance_accounts').insert({
      user_id: user.id,
      ...payload,
      opening_date: new Date().toISOString().slice(0, 10),
      currency: 'EUR',
      sort_order: accounts.length,
      is_archived: false
    }))
  }
  if (error) return showMsg(msg, 'Opslaan lukte niet.')
  showMsg(msg, 'Bewaard.', 'ok')
  await load()
  closeForm()
})

document.getElementById('cancel').addEventListener('click', closeForm)
addBtn.addEventListener('click', () => fill(null))

try {
  await load()
} catch {
  list.innerHTML = '<p class="err">Rekeningen konden niet worden geladen.</p>'
}
</script>
</body>
</html>
