<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#93294E">
<title>Budget · Fluweel</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/finance-ui/app.css">
<script type="importmap">
{
  "imports": {
    "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/+esm",
    "@supabase/ssr": "https://cdn.jsdelivr.net/npm/@supabase/ssr@0.12.5/+esm"
  }
}
</script>
</head>
<body>
<div class="wrap">
  <p class="brand">Fluweel</p>
  <h1>Wat moet er nog</h1>
  <p class="lead">Rekeningen die je nog moet betalen, of geld dat je nog krijgt.</p>
  <section class="card">
    <p class="meta" style="margin-bottom:.6rem">Nog te betalen</p>
    <div id="expenses"></div>
  </section>
  <button type="button" class="add-link" id="add-expense">+ Nog iets te betalen</button>
  <section class="card">
    <p class="meta" style="margin-bottom:.6rem">Nog te ontvangen</p>
    <div id="income"></div>
  </section>
  <button type="button" class="add-link" id="add-income">+ Nog iets te ontvangen</button>
  <form id="form" class="card" hidden>
    <input type="hidden" name="id">
    <input type="hidden" name="entry_type" value="expense">
    <label>Waarvoor
      <input name="description" placeholder="Bijv. hypotheek" required>
    </label>
    <label>Bedrag
      <input name="amount" inputmode="decimal" required>
    </label>
    <label>Datum
      <input name="date" type="date" required>
    </label>
    <p id="msg" hidden></p>
    <div class="actions">
      <button type="submit">Bewaar</button>
      <button type="button" class="secondary" id="cancel">Annuleer</button>
    </div>
    <div class="actions" id="paid-actions">
      <button type="button" class="secondary" id="pay">Dit is betaald</button>
      <button type="button" class="ghost" id="skip">Laat zitten</button>
    </div>
  </form>
</div>
<script type="module">
import {
  createSb, requireUser, parseAmount, formatMoney, formatDay, showMsg, mountNav, escapeHtml, isoDate
} from '/finance-ui/app.js'

mountNav('budget')
const sb = createSb()
const user = await requireUser(sb)
const form = document.getElementById('form')
const msg = document.getElementById('msg')
const paidActions = document.getElementById('paid-actions')
let items = []
let accounts = []

function field (name) { return form.elements[name] }

function signedAmount (item) {
  return item.entry_type === 'income' ? Number(item.amount) : -Number(item.amount)
}

function paintGroup (el, rows, empty) {
  if (!rows.length) {
    el.innerHTML = `<p class="empty">${empty}</p>`
    return
  }
  el.innerHTML = rows.map((item) => `
    <button type="button" class="row" data-id="${item.id}">
      <span>
        <span class="name">${escapeHtml(item.description)}</span>
        <span class="meta">${formatDay(item.date)}${item.recurring_id ? ' · terugkerend' : ''}</span>
      </span>
      <span class="money">${formatMoney(signedAmount(item))}</span>
    </button>
  `).join('')
  el.querySelectorAll('[data-id]').forEach((btn) => {
    btn.addEventListener('click', () => openItem(btn.dataset.id))
  })
}

function openForm (item, entryType) {
  field('id').value = item?.id || ''
  field('entry_type').value = item?.entry_type || entryType || 'expense'
  field('description').value = item?.description || ''
  field('amount').value = item?.id ? String(item.amount ?? '').replace('.', ',') : ''
  field('date').value = item?.date ? String(item.date).slice(0, 10) : isoDate(new Date())
  paidActions.hidden = !item?.id
  showMsg(msg, '', 'ok')
  form.hidden = false
  form.scrollIntoView({ behavior: 'smooth', block: 'center' })
}

function openItem (id) {
  const item = items.find((row) => row.id === id)
  if (item) openForm(item)
}

function openNew (entryType) {
  if (!accounts.length) {
    window.location.href = '/finance/accounts'
    return
  }
  openForm(null, entryType)
}

function paint () {
  paintGroup(document.getElementById('expenses'), items.filter((row) => row.entry_type === 'expense'), 'Niets open. Tik op + als er een rekening aankomt.')
  paintGroup(document.getElementById('income'), items.filter((row) => row.entry_type === 'income'), 'Niets onderweg.')
}

async function load () {
  const [planned, accountRows] = await Promise.all([
    sb.from('finance_planned_transactions').select('*').eq('status', 'pending').order('date'),
    sb.from('finance_accounts').select('id').eq('is_archived', false).order('sort_order')
  ])
  if (planned.error) throw planned.error
  if (accountRows.error) throw accountRows.error
  items = planned.data || []
  accounts = accountRows.data || []
  paint()
}

form.addEventListener('submit', async (event) => {
  event.preventDefault()
  const id = field('id').value
  const description = field('description').value.trim()
  const amount = parseAmount(field('amount').value)
  const date = field('date').value
  const entryType = field('entry_type').value || 'expense'
  if (!description) return showMsg(msg, 'Zeg even waarvoor het is.')
  if (amount == null || amount <= 0) return showMsg(msg, 'Vul een bedrag in.')
  if (!date) return showMsg(msg, 'Kies een datum.')
  let error
  if (id) {
    ;({ error } = await sb.from('finance_planned_transactions').update({
      description,
      amount,
      date,
      updated_at: new Date().toISOString()
    }).eq('id', id))
  } else {
    if (!accounts[0]) return showMsg(msg, 'Zet eerst een rekening.')
    ;({ error } = await sb.from('finance_planned_transactions').insert({
      user_id: user.id,
      account_id: accounts[0].id,
      entry_type: entryType,
      amount,
      date,
      description,
      status: 'pending'
    }))
  }
  if (error) return showMsg(msg, 'Opslaan lukte niet.')
  form.hidden = true
  await load()
})

document.getElementById('cancel').addEventListener('click', () => { form.hidden = true })
document.getElementById('add-expense').addEventListener('click', () => openNew('expense'))
document.getElementById('add-income').addEventListener('click', () => openNew('income'))

document.getElementById('pay').addEventListener('click', async () => {
  const id = field('id').value
  if (!id) return
  const { error } = await sb.rpc('finance_mark_planned_paid', { planned_id: id })
  if (error) return showMsg(msg, 'Dit kon niet worden afgevinkt.')
  form.hidden = true
  await load()
})

document.getElementById('skip').addEventListener('click', async () => {
  const id = field('id').value
  if (!id) return
  const { error } = await sb.from('finance_planned_transactions').update({
    status: 'skipped',
    updated_at: new Date().toISOString()
  }).eq('id', id)
  if (error) return showMsg(msg, 'Laten zitten lukte niet.')
  form.hidden = true
  await load()
})

try {
  await load()
} catch {
  document.getElementById('expenses').innerHTML = '<p class="err">Aankomende rekeningen konden niet worden geladen.</p>'
}
</script>
</body>
</html>
