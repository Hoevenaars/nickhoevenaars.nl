<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#93294E">
<title>Home · Fluweel</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/finance-ui/app.css">
<script type="importmap">
{
  "imports": {
    "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/+esm",
    "@supabase/ssr": "https://cdn.jsdelivr.net/npm/@supabase/ssr@0.12.5/+esm"
  }
}
</script>
</head>
<body class="home">
<header class="hero">
  <p class="hero-hello">Welkom terug</p>
  <h1 id="hello-name">…</h1>
  <p class="hero-period" id="period"></p>
  <div class="hero-stats">
    <div class="hero-stat"><span>Inkomsten</span><strong id="income">€0</strong></div>
    <div class="hero-stat"><span>Uitgaven</span><strong id="expense">€0</strong></div>
  </div>
</header>
<div class="wrap">
  <section class="metrics">
    <article class="metric">
      <div class="metric-icon green" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 14c2.5-1 4.5-5 8-5s5.5 4 8 5"/><path d="M4 19h16"/></svg>
      </div>
      <label>Resultaat</label>
      <b id="result">€0</b>
    </article>
    <article class="metric">
      <div class="metric-icon gold" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 8h10l1 11H6L7 8z"/><path d="M9 8V7a3 3 0 0 1 6 0v1"/><circle cx="12" cy="14" r="1.4"/></svg>
      </div>
      <label>Vermogen</label>
      <b id="worth">€0</b>
    </article>
    <article class="metric">
      <div class="metric-icon rose" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11 12 4l8 7v8a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1z"/></svg>
      </div>
      <label>Vaste lasten</label>
      <b id="fixed">€0</b>
    </article>
    <article class="metric">
      <div class="metric-icon orange" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 4v2M12 18v2M4 12h2M18 12h2"/></svg>
      </div>
      <label>Spaardoelen</label>
      <b id="goals">0</b>
    </article>
  </section>

  <p class="section-label">Saldo van je rekeningen</p>
  <section class="card" id="accounts"></section>
  <a class="add-link" href="/finance/accounts">+ Rekening toevoegen</a>

  <p class="section-label">Top uitgaven</p>
  <section class="card" id="top"></section>
</div>
<a class="fab" href="/finance/transactions" aria-label="Nieuwe transactie">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</a>
<script type="module">
import {
  createSb, requireUser, mountNav, escapeHtml, formatMoney, accountBalance,
  periodRange, formatPeriod, periodTotals, netWorth, fixedCosts, topExpenses, displayName
} from '/finance-ui/app.js'

mountNav('home')
const sb = createSb()
const user = await requireUser(sb)

function paintAccounts (accounts, transactions) {
  const el = document.getElementById('accounts')
  const live = accounts.filter((account) => !account.is_archived)
  if (!live.length) {
    el.innerHTML = '<p class="empty">Nog geen rekeningen.</p>'
    return
  }
  const rows = live.map((account) => {
    const balance = accountBalance(account, transactions)
    return `<div class="row" role="listitem"><span class="name">${escapeHtml(account.name)}</span><span class="money">${formatMoney(balance)}</span></div>`
  })
  rows.push(`<div class="row total-row"><span class="name">Totaal</span><span class="money">${formatMoney(netWorth(live, transactions))}</span></div>`)
  el.innerHTML = rows.join('')
}

function paintBars (rows) {
  const el = document.getElementById('top')
  if (!rows.length) {
    el.innerHTML = '<p class="empty">Nog geen uitgaven deze periode.</p>'
    return
  }
  el.innerHTML = `<div class="bars">${rows.map((row) => `
    <div class="bar-row">
      <span>${escapeHtml(row.name)}</span>
      <div class="track"><div class="fill" style="width:${row.pct}%;background:${escapeHtml(row.color)}"></div></div>
      <span class="amt">${formatMoney(row.amount)}</span>
    </div>
  `).join('')}</div>`
}

try {
  const [
    settingsRes, accountsRes, txRes, catsRes, goalsRes, recRes, plannedRes
  ] = await Promise.all([
    sb.from('finance_settings').select('*').maybeSingle(),
    sb.from('finance_accounts').select('*').eq('is_archived', false).order('sort_order'),
    sb.from('finance_transactions').select('id, account_id, counterparty_account_id, category_id, entry_type, amount, date'),
    sb.from('finance_categories').select('id, name, color, kind'),
    sb.from('finance_goals').select('id'),
    sb.from('finance_recurring_transactions').select('amount, entry_type, frequency, interval_count, is_active'),
    sb.from('finance_planned_transactions').select('category_id, entry_type, amount, date, status, description')
  ])
  const error = settingsRes.error || accountsRes.error || txRes.error || catsRes.error || goalsRes.error || recRes.error || plannedRes.error
  if (error) throw error

  const settings = settingsRes.data
  const accounts = accountsRes.data || []
  const transactions = txRes.data || []
  const period = periodRange(new Date(), settings?.month_start_day || 1)
  const totals = periodTotals(transactions, plannedRes.data || [], period.startIso, period.endIso)
  const worth = netWorth(accounts, transactions)
  const resultEl = document.getElementById('result')

  document.getElementById('hello-name').textContent = displayName(user, settings)
  document.getElementById('period').textContent = formatPeriod(period.start, period.end)
  document.getElementById('income').textContent = formatMoney(totals.income)
  document.getElementById('expense').textContent = formatMoney(totals.expense)
  resultEl.textContent = formatMoney(totals.result, { signed: true })
  resultEl.classList.toggle('up', totals.result > 0)
  document.getElementById('worth').textContent = formatMoney(worth)
  document.getElementById('fixed').textContent = formatMoney(fixedCosts(recRes.data || []))
  document.getElementById('goals').textContent = String((goalsRes.data || []).length)
  paintAccounts(accounts, transactions)
  paintBars(topExpenses(transactions, plannedRes.data || [], catsRes.data || [], period.startIso, period.endIso))
} catch {
  document.getElementById('accounts').innerHTML = '<p class="err">Overzicht kon niet worden geladen.</p>'
}
</script>
</body>
</html>
